[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-nautilus-backtest-engine"
version = "2.5.3"
description = "A-share execution replay and independent account validation on NautilusTrader"
readme = "README.md"
authors = [{ name = "Changlong Xie" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "nautilus_trader==1.231.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.setuptools]
packages = ["engine", "contracts"]

[tool.setuptools.package-data]
engine = ["split_native.cp312-win_amd64.pyd", "split_native.pyx", "SPLIT_BUILD.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
